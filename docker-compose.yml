# Local MySQL for development. Start it with:
#   docker compose up -d
# Credentials here must match DIRIS_DATABASE_URL in your .env.
services:
  mysql:
    image: mysql:8.4
    container_name: diris-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: diris
      MYSQL_USER: diris
      MYSQL_PASSWORD: diris
    ports:
      - "3306:3306"
    volumes:
      - diris_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  diris_mysql_data:

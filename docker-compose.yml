# Local dev services (MySQL + Neo4j). Start with:
#   docker compose up -d
# Credentials here must match the DIRIS_* values in your .env.
services:
  mysql:
    image: mysql:8.4
    container_name: diris-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: diris
      MYSQL_USER: diris
      MYSQL_PASSWORD: diris
    ports:
      # Host 3307 -> container 3306, so a native MySQL on 3306 isn't disturbed.
      - "3307:3306"
    volumes:
      - diris_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: diris-neo4j
    restart: unless-stopped
    environment:
      # user/password must match DIRIS_NEO4J_USER / DIRIS_NEO4J_PASSWORD
      NEO4J_AUTH: neo4j/dirispassword
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt (driver)
    volumes:
      - diris_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p dirispassword 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  diris_mysql_data:
  diris_neo4j_data:
